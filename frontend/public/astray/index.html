<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Astray Game</title>
    <!-- Script references (ensure these files are in your project folder) -->
    <script src="Box2dWeb.min.js"></script>
    <script src="Three.js"></script>
    <script src="keyboard.js"></script>
    <script src="jquery.js"></script>
    <script src="maze.js"></script>

    <script>
        // Global variables and textures
        var camera, scene, renderer, light;
        var maze, mazeMesh, mazeDimension = 11;
        var planeMesh, ballMesh, ballRadius = 0.25;
        var keyAxis = [0, 0];
        var ironTexture = THREE.ImageUtils.loadTexture('ball.png'),
            planeTexture = THREE.ImageUtils.loadTexture('concrete.png'),
            brickTexture = THREE.ImageUtils.loadTexture('brick.png');
        var gameState;

        // Box2D shortcuts
        var b2World = Box2D.Dynamics.b2World,
            b2FixtureDef = Box2D.Dynamics.b2FixtureDef,
            b2BodyDef = Box2D.Dynamics.b2BodyDef,
            b2Body = Box2D.Dynamics.b2Body,
            b2CircleShape = Box2D.Collision.Shapes.b2CircleShape,
            b2PolygonShape = Box2D.Collision.Shapes.b2PolygonShape,
            b2Settings = Box2D.Common.b2Settings,
            b2Vec2 = Box2D.Common.Math.b2Vec2;
        var wWorld, wBall;

        // Global progress variables (including sessionId)
        let startTime = Date.now();
        let currentScore = 0;
        let mistakeCount = 0;
        let currentLevel = 1;
        let sessionId = null;

        // =====================
        // Arduino Serial Integration
        // =====================

        function triggerArrowKey(keyName) {
            let keyCode;
            switch (keyName) {
                case 'right': keyCode = 39; break;
                case 'left': keyCode = 37; break;
                case 'up': keyCode = 38; break;
                case 'down': keyCode = 40; break;
                default:
                    console.warn("triggerArrowKey: Unknown keyName:", keyName);
                    return;
            }
            console.log(`Simulating ${keyName} key event (keydown).`);
            const event = new KeyboardEvent('keydown', {
                key: keyName,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true
            });
            document.dispatchEvent(event);
            setTimeout(() => {
                console.log(`Simulating ${keyName} key event (keyup).`);
                const upEvent = new KeyboardEvent('keyup', {
                    key: keyName,
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true
                });
                document.dispatchEvent(upEvent);
            }, 50);
        }

        function processArduinoData(value) {
            const trimmed = value.trim();
            console.log("Received Arduino data:", trimmed);
            switch (trimmed) {
                case '0':
                    console.log('Arduino: Moving right');
                    triggerArrowKey('right');
                    break;
                case '1':
                    console.log('Arduino: Moving left');
                    triggerArrowKey('left');
                    break;
                case '2':
                    console.log('Arduino: Moving up');
                    triggerArrowKey('up');
                    break;
                case '3':
                    console.log('Arduino: Moving down');
                    triggerArrowKey('down');
                    break;
                default:
                    console.log('Arduino: Unknown value:', trimmed);
            }
        }

        async function connectSerial() {
            if (!('serial' in navigator)) {
                console.error('Web Serial API not supported in this browser.');
                return;
            }
            try {
                console.log("Requesting serial port...");
                const port = await navigator.serial.requestPort();
                console.log("Serial port selected. Opening port...");
                await port.open({ baudRate: 115200 });
                console.log("Serial port opened at 115200 baud.");
                const reader = port.readable.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        console.log("Reader done.");
                        break;
                    }
                    if (value) {
                        const text = decoder.decode(value);
                        console.log("Raw serial data:", text);
                        text.split(/\r?\n/).forEach(line => {
                            if (line) {
                                processArduinoData(line);
                            }
                        });
                    }
                }
            } catch (err) {
                console.error('Error in serial communication:', err);
            }
        }

        // =====================
        // Game Setup and Loop
        // =====================

        function createPhysicsWorld() {
            console.log("Creating physics world.");
            wWorld = new b2World(new b2Vec2(0, 0), true);
            var bodyDef = new b2BodyDef();
            bodyDef.type = b2Body.b2_dynamicBody;
            bodyDef.position.Set(1, 1);
            wBall = wWorld.CreateBody(bodyDef);
            var fixDef = new b2FixtureDef();
            fixDef.density = 1.0;
            fixDef.friction = 0.0;
            fixDef.restitution = 0.25;
            fixDef.shape = new b2CircleShape(ballRadius);
            wBall.CreateFixture(fixDef);
            bodyDef.type = b2Body.b2_staticBody;
            fixDef.shape = new b2PolygonShape();
            fixDef.shape.SetAsBox(0.5, 0.5);
            for (var i = 0; i < maze.dimension; i++) {
                for (var j = 0; j < maze.dimension; j++) {
                    if (maze[i][j]) {
                        bodyDef.position.x = i;
                        bodyDef.position.y = j;
                        wWorld.CreateBody(bodyDef).CreateFixture(fixDef);
                    }
                }
            }
        }

        function generate_maze_mesh(field) {
            var dummy = new THREE.Geometry();
            for (var i = 0; i < field.dimension; i++) {
                for (var j = 0; j < field.dimension; j++) {
                    if (field[i][j]) {
                        var geometry = new THREE.CubeGeometry(1, 1, 1, 1, 1, 1);
                        var mesh_ij = new THREE.Mesh(geometry);
                        mesh_ij.position.x = i;
                        mesh_ij.position.y = j;
                        mesh_ij.position.z = 0.5;
                        THREE.GeometryUtils.merge(dummy, mesh_ij);
                    }
                }
            }
            var material = new THREE.MeshPhongMaterial({ map: brickTexture });
            var mesh = new THREE.Mesh(dummy, material);
            return mesh;
        }

        function createRenderWorld() {
            console.log("Creating render world.");
            scene = new THREE.Scene();
            light = new THREE.PointLight(0xffffff, 1);
            light.position.set(1, 1, 1.3);
            scene.add(light);
            var g = new THREE.SphereGeometry(ballRadius, 32, 16);
            var m = new THREE.MeshPhongMaterial({ map: ironTexture });
            ballMesh = new THREE.Mesh(g, m);
            ballMesh.position.set(1, 1, ballRadius);
            scene.add(ballMesh);
            var aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(60, aspect, 1, 1000);
            camera.position.set(1, 1, 5);
            scene.add(camera);
            mazeMesh = generate_maze_mesh(maze);
            scene.add(mazeMesh);
            g = new THREE.PlaneGeometry(mazeDimension * 10, mazeDimension * 10, mazeDimension, mazeDimension);
            planeTexture.wrapS = planeTexture.wrapT = THREE.RepeatWrapping;
            planeTexture.repeat.set(mazeDimension * 5, mazeDimension * 5);
            m = new THREE.MeshPhongMaterial({ map: planeTexture });
            planeMesh = new THREE.Mesh(g, m);
            planeMesh.position.set((mazeDimension - 1) / 2, (mazeDimension - 1) / 2, 0);
            planeMesh.rotation.set(Math.PI / 2, 0, 0);
            scene.add(planeMesh);
        }

        function updatePhysicsWorld() {
            var lv = wBall.GetLinearVelocity();
            lv.Multiply(0.95);
            wBall.SetLinearVelocity(lv);
            var f = new b2Vec2(keyAxis[0] * wBall.GetMass() * 0.25, keyAxis[1] * wBall.GetMass() * 0.25);
            wBall.ApplyImpulse(f, wBall.GetPosition());
            keyAxis = [0, 0];
            wWorld.Step(1 / 60, 8, 3);
        }

        function updateRenderWorld() {
            var stepX = wBall.GetPosition().x - ballMesh.position.x;
            var stepY = wBall.GetPosition().y - ballMesh.position.y;
            ballMesh.position.x += stepX;
            ballMesh.position.y += stepY;
            var tempMat = new THREE.Matrix4();
            tempMat.makeRotationAxis(new THREE.Vector3(0, 1, 0), stepX / ballRadius);
            tempMat.multiplySelf(ballMesh.matrix);
            ballMesh.matrix = tempMat;
            tempMat = new THREE.Matrix4();
            tempMat.makeRotationAxis(new THREE.Vector3(1, 0, 0), -stepY / ballRadius);
            tempMat.multiplySelf(ballMesh.matrix);
            ballMesh.matrix = tempMat;
            ballMesh.rotation.getRotationFromMatrix(ballMesh.matrix);
            camera.position.x += (ballMesh.position.x - camera.position.x) * 0.1;
            camera.position.y += (ballMesh.position.y - camera.position.y) * 0.1;
            camera.position.z += (5 - camera.position.z) * 0.1;
            light.position.x = camera.position.x;
            light.position.y = camera.position.y;
            light.position.z = camera.position.z - 3.7;
        }

        // Posts progress data to the backend
        function sendProgress() {
            const totalTime = Math.floor((Date.now() - startTime) / 1000) + "s";
            const progressData = {
                sessionId: sessionId,
                score: currentScore,
                mistakes: mistakeCount,
                completed: false,
                endLevel: currentLevel,
                totalTime: totalTime
            };
            console.log("Posting progress:", progressData);
            fetch('http://localhost:5000/api/games/progress', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-auth-token': localStorage.getItem('token')
                },
                body: JSON.stringify(progressData)
            })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => { throw new Error(text) });
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("Progress posted:", data);
                })
                .catch(error => {
                    console.error("Error posting progress:", error);
                });
        }

        function gameLoop() {
            switch (gameState) {
                case 'initialize':
                    console.log("Game state: initialize");
                    maze = generateSquareMaze(mazeDimension);
                    maze[mazeDimension - 1][mazeDimension - 2] = false;
                    createPhysicsWorld();
                    createRenderWorld();
                    camera.position.set(1, 1, 5);
                    light.position.set(1, 1, 1.3);
                    light.intensity = 0;
                    var level = Math.floor((mazeDimension - 1) / 2 - 4);
                    $('#level').html('Level ' + level);
                    gameState = 'fade in';
                    break;

                case 'fade in':
                    light.intensity += 0.1 * (1.0 - light.intensity);
                    renderer.render(scene, camera);
                    if (Math.abs(light.intensity - 1.0) < 0.05) {
                        light.intensity = 1.0;
                        gameState = 'play';
                        console.log("Transition to game state: play");
                    }
                    break;

                case 'play':
                    updatePhysicsWorld();
                    updateRenderWorld();
                    renderer.render(scene, camera);
                    var mazeX = Math.floor(ballMesh.position.x + 0.5);
                    var mazeY = Math.floor(ballMesh.position.y + 0.5);
                    if (mazeX === mazeDimension && mazeY === mazeDimension - 2) {
                        currentScore += 100;
                        currentLevel++;
                        console.log("Level complete! Score:", currentScore, "Level:", currentLevel);
                        sendProgress();
                        mazeDimension += 2;
                        gameState = 'fade out';
                    }
                    break;

                case 'fade out':
                    updatePhysicsWorld();
                    updateRenderWorld();
                    light.intensity += 0.1 * (0.0 - light.intensity);
                    renderer.render(scene, camera);
                    if (Math.abs(light.intensity - 0.0) < 0.1) {
                        light.intensity = 0.0;
                        renderer.render(scene, camera);
                        console.log("Transitioning to initialize new level.");
                        gameState = 'initialize';
                    }
                    break;
            }
            requestAnimationFrame(gameLoop);
        }

        function onResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }

        function onMoveKey(axis) {
            keyAxis = axis.slice(0);
            console.log("Key axis updated:", keyAxis);
        }

        // jQuery helper functions to center elements
        jQuery.fn.centerv = function () {
            var wh = window.innerHeight;
            var h = this.outerHeight();
            this.css("position", "absolute");
            this.css("top", Math.max(0, (wh - h) / 2) + "px");
            return this;
        };

        jQuery.fn.centerh = function () {
            var ww = window.innerWidth;
            var w = this.outerWidth();
            this.css("position", "absolute");
            this.css("left", Math.max(0, (ww - w) / 2) + "px");
            return this;
        };

        jQuery.fn.center = function () {
            this.centerv();
            this.centerh();
            return this;
        };

        $(document).ready(function () {
            // Start a new game session by calling the backend endpoint.
            fetch('http://localhost:5000/api/games/start', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-auth-token': localStorage.getItem('token')
                },
                body: JSON.stringify({
                    gameId: 'astray',
                    gameName: 'Astray',
                    startLevel: 1
                })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => { throw new Error(text) });
                    }
                    return response.json();
                })
                .then(data => {
                    sessionId = data.sessionId;
                    console.log("Session started:", sessionId);
                    window.parent.postMessage({ type: "sessionStarted", sessionId: sessionId }, "*");
                })
                .catch(error => {
                    console.error("Error starting session:", error);
                });

            // Update the timer display every second.
            setInterval(function () {
                var elapsed = Math.floor((Date.now() - startTime) / 1000);
                $('#timer').html('Time: ' + elapsed + ' s');
            }, 1000);

            // Prepare and hide the instructions.
            $('#instructions').center();
            $('#instructions').hide();
            KeyboardJS.bind.key('i', function () {
                $('#instructions').show();
                console.log("Instructions shown.");
            }, function () {
                $('#instructions').hide();
                console.log("Instructions hidden.");
            });

            // Create the Three.js renderer.
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Bind keyboard and resize events.
            KeyboardJS.bind.axis('left', 'right', 'down', 'up', onMoveKey);
            KeyboardJS.bind.axis('h', 'l', 'j', 'k', onMoveKey);
            $(window).resize(onResize);

            // Set the initial game state and start the game loop.
            gameState = 'initialize';
            requestAnimationFrame(gameLoop);
        });
    </script>

    <style>
        body {
            background: black;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica';
            width: 100vw;
        }

        #instructions {
            background-color: rgba(0, 0, 0, 0.75);
            color: white;
            text-align: center;
            padding: 32px;
            margin: 0px;
            display: inline;
            border: 2px solid white;
        }

        #help {
            position: absolute;
            left: 0px;
            bottom: 0px;
            padding: 4px;
            color: white;
        }

        #level {
            position: absolute;
            left: 0px;
            top: 0px;
            padding: 4px;
            color: yellow;
            font-weight: bold;
        }

        #timer {
            position: absolute;
            right: 0px;
            top: 0px;
            padding: 4px;
            color: lime;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
        }

        #arduinoConnect {
            position: absolute;
            right: 0px;
            bottom: 0px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="instructions">
        How to play Astray:
        <br><br>
        Use the arrow keys to move the ball and find the exit to the maze.
        <br><br>
        Vim trainees: h, j, k, l
    </div>
    <div id="help">
        Hold down the 'I' key for instructions.
    </div>
    <div id="level">
        Level 1
    </div>
    <div id="timer">Time: 0 s</div>
    <button id="arduinoConnect">Connect Arduino</button>
    <script>
        // Attach event listener to the Arduino connect button.
        document.getElementById('arduinoConnect').addEventListener('click', function () {
            console.log("Arduino connect button clicked.");
            connectSerial();
        });
    </script>
</body>

</html>
