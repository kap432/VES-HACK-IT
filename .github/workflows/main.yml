```yaml
name: VES-HACK-IT - CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CI: true
  NODE_VERSION: '20.x'

jobs:
  build:
    name: Build and Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Restore dependency cache (fallback)
        id: cache-npm-fallback
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies with retry
        uses: nick-invision/retry@v3
        with:
          timeout_seconds: 120
          max_attempts: 3
          command: npm ci

      - name: Check for available scripts
        id: check_scripts
        run: |
          if jq -e '.scripts.test' package.json > /dev/null; then
            echo "test_exists=true" >> $GITHUB_OUTPUT
          else
            echo "test_exists=false" >> $GITHUB_OUTPUT
          fi
          if jq -e '.scripts.build' package.json > /dev/null; then
            echo "build_exists=true" >> $GITHUB_OUTPUT
          else
            echo "build_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.check_scripts.outputs.test_exists == 'true'
        run: npm test

      - name: Run build
        if: steps.check_scripts.outputs.build_exists == 'true'
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-node-${{ matrix.node-version }}
          path: |
            dist/
            node_modules/
            package.json
            package-lock.json
            index.js
          retention-days: 7

  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Setup Node.js for Snyk
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: ${{ github.event_name == 'pull_request' }} # Don't fail PRs for new vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

  deploy:
    name: Deploy to Production
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://ves-hack-it.example.com

    steps:
      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: 'Deploying to production environment'
            });
            core.setOutput('deployment_id', deployment.id);

      - name: Download production-ready artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-node-${{ env.NODE_VERSION }}
          path: ./app

      - name: Deploy to target
        id: deploy_step
        run: |
          echo "Starting deployment to production..."
          # Add your deployment commands here (e.g., scp, rsync, kubectl apply)
          # Simulating a 15-second deployment process
          sleep 15
          echo "Deployment successful."

      - name: Update Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: '${{ job.status }}',
              environment_url: 'https://ves-hack-it.example.com',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  rollback:
    name: Automatic Rollback
    needs: deploy
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Report failure
        run: echo "Deployment job failed. Initiating rollback process."

      - name: Trigger Rollback
        run: |
          echo "Fetching last known good deployment artifact..."
          # In a real-world scenario, you would use a script to:
          # 1. Fetch the previous successful deployment artifact from storage.
          # 2. Re-run your deployment script with that artifact.
          # Example: aws s3 cp s3://my-artifacts/last-good.zip . && ./deploy.sh
          echo "Rolling back to previous version..."
          sleep 10
          echo "Rollback complete."

      - name: Create Rollback Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              description: `Automated rollback triggered due to deployment failure.`,
              state: 'failure'
            });
```